                    <span className="px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-bold whitespace-nowrap">
                      {g.val}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* All Smartphones Section */}
          <section id="phones" className="py-16 px-4 sm:px-8 border-b border-slate-800">
            <div className="max-w-7xl mx-auto">
              <div className="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
                <div>
                  <span className="text-xs font-bold uppercase text-amber-400 tracking-wider">All Smartphone Brands</span>
                  <h2 className="text-3xl sm:text-4xl font-black font-display text-white">Latest 5G Smartphones</h2>
                </div>

                <div className="flex gap-1.5 overflow-x-auto pb-1">
                  {['All', 'Apple', 'Samsung', 'OnePlus', 'Vivo', 'Realme', 'Oppo', 'Motorola'].map(brand => (
                    <button
                      key={brand}
                      onClick={() => setSelectedBrand(brand)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${
                        selectedBrand === brand ? 'bg-amber-400 text-slate-950' : 'bg-slate-900 text-slate-300 border border-slate-800'
                      }`}
                    >
                      {brand}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                {filteredPhones.map(phone => (
                  <div key={phone.id} className="p-4 rounded-2xl bg-slate-900/60 border border-slate-800 hover:border-slate-700 flex flex-col justify-between transition-all">
                    <div>
                      <div className="text-xs font-bold text-amber-400">{phone.brand}</div>
                      <h3 className="text-base font-bold text-white font-display mt-0.5">{phone.name}</h3>

                      <div className="my-3 p-2 rounded-xl bg-amber-400/10 border border-amber-400/30 text-[11px] text-amber-200">
                        🎁 <strong>Free Gift:</strong> {phone.freeGift}
                      </div>

                      <div className="text-[11px] text-slate-400 space-y-1">
                        <div>CPU: {phone.specs.cpu}</div>
                        <div>RAM/ROM: {phone.specs.ramRom}</div>
                        <div>Camera: {phone.specs.cam}</div>
                      </div>
                    </div>

                    <div className="mt-4 pt-3 border-t border-slate-800">
                      <div className="flex items-baseline justify-between mb-2">
                        <span className="text-lg font-black text-white font-mono-num">₹{phone.price.toLocaleString('en-IN')}</span>
                        <span className="text-[11px] text-amber-400">0% EMI: ₹{Math.round(phone.price/12)}/mo</span>
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <button
                          onClick={() => addToCart(phone, 'phone')}
                          className="py-2 text-xs font-bold bg-slate-800 hover:bg-slate-700 text-white rounded-lg border border-slate-700"
                        >
                          Add to Bag
                        </button>
                        <a
                          href={`https://wa.me/${STORE_INFO.whatsapp}?text=${encodeURIComponent(`Namaste Chintu Mobile Silli! I want to order ${phone.name} (Price: ₹${phone.price}). Free gift sath me milega na?`)}`}
                          target="_blank"
                          rel="noreferrer"
                          className="py-2 text-xs font-bold bg-amber-400 hover:bg-amber-300 text-slate-950 rounded-lg text-center"
                        >
                          WhatsApp
                        </a>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Laptops Section */}
          <section id="laptops" className="py-16 px-4 sm:px-8 border-b border-slate-800 bg-[#070A0F]">
            <div className="max-w-7xl mx-auto">
              <div className="mb-8">
                <span className="text-xs font-bold uppercase text-amber-400 tracking-wider">Chintu Laptop Zone · Silli</span>
                <h2 className="text-3xl sm:text-4xl font-black font-display text-white">Laptops for Students, Work & Gaming</h2>
                <p className="text-xs sm:text-sm text-slate-300 mt-1">HP, Dell, Lenovo, ASUS, Acer & Apple MacBook with <strong>Free Laptop Bag + Wireless Mouse</strong>!</p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {LAPTOPS.map(laptop => (
                  <div key={laptop.id} className="p-5 rounded-2xl bg-slate-900 border border-slate-800 flex flex-col justify-between">
                    <div>
                      <div className="text-xs font-bold text-sky-400">{laptop.brand} Laptop</div>
                      <h3 className="text-lg font-bold text-white font-display mt-0.5">{laptop.name}</h3>

                      <div className="my-3 p-2.5 rounded-xl bg-amber-400/10 border border-amber-400/30 text-xs text-amber-300">
                        🎁 <strong>Free Gift:</strong> {laptop.freeGift}
                      </div>

                      <p className="text-xs text-slate-400 leading-relaxed">{laptop.specs}</p>
                    </div>

                    <div className="mt-4 pt-3 border-t border-slate-800">
                      <div className="flex items-baseline justify-between mb-2">
                        <span className="text-xl font-black text-white font-mono-num">₹{laptop.price.toLocaleString('en-IN')}</span>
                        <span className="text-xs text-amber-400">0% EMI: ₹{Math.round(laptop.price/12)}/mo</span>
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <button
                          onClick={() => addToCart(laptop, 'laptop')}
                          className="py-2 text-xs font-bold bg-slate-800 hover:bg-slate-700 text-white rounded-lg border border-slate-700"
                        >
                          Add to Bag
                        </button>
                        <a
                          href={`https://wa.me/${STORE_INFO.whatsapp}?text=${encodeURIComponent(`Namaste Chintu Mobile & Laptop Silli! I want to enquire about ${laptop.name} (Price: ₹${laptop.price}).`)}`}
                          target="_blank"
                          rel="noreferrer"
                          className="py-2 text-xs font-bold bg-amber-400 hover:bg-amber-300 text-slate-950 rounded-lg text-center"
                        >
                          WhatsApp
                        </a>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* 0% EMI Calculator */}
          <section id="emi" className="py-16 px-4 sm:px-8 border-b border-slate-800">
            <div className="max-w-4xl mx-auto bg-slate-900/80 p-6 sm:p-8 rounded-3xl border border-slate-800">
              <div className="text-center mb-6">
                <span className="text-xs font-bold uppercase text-amber-400 tracking-wider">Bajaj & TVS Finance</span>
                <h2 className="text-3xl font-black font-display text-white">0% Interest EMI Calculator</h2>
                <p className="text-xs text-slate-300 mt-1">₹0 downpayment par koi bhi mobile ya laptop ghar le jayein.</p>
              </div>

              <div className="space-y-5">
                <div>
                  <div className="flex justify-between text-xs font-bold text-slate-300 mb-1">
                    <span>Phone / Laptop Price</span>
                    <span className="text-amber-400 font-mono-num text-base">₹{devicePrice.toLocaleString('en-IN')}</span>
                  </div>
                  <input
                    type="range"
                    min="10000"
                    max="120000"
                    step="1000"
                    value={devicePrice}
                    onChange={e => setDevicePrice(Number(e.target.value))}
                    className="w-full accent-amber-400"
                  />
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">Downpayment</label>
                    <div className="flex gap-2">
                      {[0, 20, 30].map(pct => (
                        <button
                          key={pct}
                          onClick={() => setDownpaymentPct(pct)}
                          className={`flex-1 py-1.5 rounded-lg text-xs font-bold ${downpaymentPct === pct ? 'bg-amber-400 text-slate-950' : 'bg-slate-950 text-slate-400'}`}
                        >
                          {pct === 0 ? '₹0 Down' : `${pct}%`}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">Tenure (Months)</label>
                    <div className="flex gap-2">
                      {[6, 9, 12, 18].map(m => (
                        <button
                          key={m}
                          onClick={() => setTenure(m)}
                          className={`flex-1 py-1.5 rounded-lg text-xs font-bold ${tenure === m ? 'bg-emerald-500 text-slate-950' : 'bg-slate-950 text-slate-400'}`}
                        >
                          {m}M
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="p-4 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-between">
                  <div>
                    <span className="text-xs text-slate-400">Monthly EMI</span>
                    <div className="text-3xl font-black text-white font-mono-num">₹{monthlyEmi.toLocaleString('en-IN')}<span className="text-xs font-normal text-slate-400">/mo</span></div>
                  </div>
                  <a
                    href={`https://wa.me/${STORE_INFO.whatsapp}?text=${encodeURIComponent(`Namaste Chintu Mobile Silli! I want to buy a device worth ₹${devicePrice} on 0% EMI (${tenure} months). Please verify my Aadhaar & PAN approval.`)}`}
                    target="_blank"
                    rel="noreferrer"
                    className="px-4 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-xs"
                  >
                    Apply on WhatsApp
                  </a>
                </div>
              </div>
            </div>
          </section>

          {/* Express Phone & Laptop Repair Lab */}
          <section id="repair" className="py-16 px-4 sm:px-8 border-b border-slate-800 bg-[#070A0F]">
            <div className="max-w-7xl mx-auto">
              <div className="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
                <div>
                  <span className="text-xs font-bold uppercase text-amber-400 tracking-wider">35-Minute On-The-Spot Service</span>
                  <h2 className="text-3xl sm:text-4xl font-black font-display text-white">Phone & Laptop Repairing Lab</h2>
                  <p className="text-xs sm:text-sm text-slate-300 mt-1">Original screen, battery & SSD upgrade with up to 180 days warranty at New Bundu Road Silli.</p>
                </div>

                <div className="flex gap-2">
                  <button
                    onClick={() => { setRepairTab('mobile'); setSelectedRepairIdx(0); }}
                    className={`px-4 py-2 rounded-xl text-xs font-bold ${repairTab === 'mobile' ? 'bg-amber-400 text-slate-950' : 'bg-slate-900 text-slate-400'}`}
                  >
                    Mobile Phone Repair
                  </button>
                  <button
                    onClick={() => { setRepairTab('laptop'); setSelectedRepairIdx(0); }}
                    className={`px-4 py-2 rounded-xl text-xs font-bold ${repairTab === 'laptop' ? 'bg-amber-400 text-slate-950' : 'bg-slate-900 text-slate-400'}`}
                  >
                    Laptop Repair & Upgrade
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                {currentRepairs.map((r, idx) => (
                  <div
                    key={idx}
                    onClick={() => setSelectedRepairIdx(idx)}
                    className={`p-4 rounded-2xl cursor-pointer border ${selectedRepairIdx === idx ? 'bg-slate-900 border-amber-400' : 'bg-slate-950 border-slate-800'}`}
                  >
                    <div className="text-sm font-bold text-white">{r.issue}</div>
                    <div className="text-xs text-amber-400 font-bold mt-2">Starting ₹{r.price} · {r.time}</div>
                    <div className="text-[11px] text-emerald-400 mt-0.5">{r.warranty}</div>
                    <a
                      href={`https://wa.me/${STORE_INFO.whatsapp}?text=${encodeURIComponent(`Namaste Chintu Mobile Silli! Mujhe ${r.issue} karwana hai. Dukan par technician available hain?`)}`}
                      target="_blank"
                      rel="noreferrer"
                      className="mt-3 block text-center py-1.5 rounded-lg bg-amber-400/20 text-amber-300 font-bold text-xs"
                    >
                      Book Repair Slot
                    </a>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Live Google Map & Store Location */}
          <section id="map" className="py-16 px-4 sm:px-8 border-b border-slate-800">
            <div className="max-w-7xl mx-auto">
              <div className="text-center max-w-2xl mx-auto mb-8">
                <span className="text-xs font-bold uppercase text-amber-400 tracking-wider">Store Location</span>
                <h2 className="text-3xl sm:text-4xl font-black font-display text-white">Visit Our Silli Showroom</h2>
                <p className="text-xs sm:text-sm text-slate-300 mt-1">
                  <strong>{STORE_INFO.address}</strong> ({STORE_INFO.landmark})
                </p>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                <div className="lg:col-span-8 bg-slate-900 p-4 rounded-3xl border border-slate-800 space-y-4">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-slate-300">Live Google Maps</span>
                    <a
                      href={STORE_INFO.mapDirectionsUrl}
                      target="_blank"
                      rel="noreferrer"
                      className="px-3.5 py-1.5 rounded-lg bg-amber-400 text-slate-950 font-bold text-xs"
                    >
                      Start GPS Navigation
                    </a>
                  </div>
                  <div className="w-full h-80 rounded-2xl overflow-hidden border border-slate-700">
                    <iframe
                      title="Chintu Mobile Silli Location"
                      src={STORE_INFO.mapEmbedUrl}
                      width="100%"
                      height="100%"
                      style={{ border: 0 }}
                      allowFullScreen=""
                      loading="lazy"
                    ></iframe>
                  </div>
                </div>

                <div className="lg:col-span-4 bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-4 text-xs">
                  <div>
                    <span className="text-slate-400 uppercase font-bold text-[10px]">Showroom Hours</span>
                    <div className="text-sm font-bold text-white mt-1">{STORE_INFO.timings}</div>
                  </div>

                  <div>
                    <span className="text-slate-400 uppercase font-bold text-[10px]">Call or WhatsApp Store</span>
                    <div className="space-y-1.5 mt-1">
                      {STORE_INFO.phones.map(p => (
                        <div key={p} className="flex justify-between items-center p-2 rounded-lg bg-slate-950">
                          <span className="font-bold text-white font-mono">+91 {p}</span>
                          <a href={`tel:${p}`} className="text-amber-400 font-bold">Call</a>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="p-3 rounded-xl bg-amber-400/10 border border-amber-400/20 text-amber-300">
                    🎁 <strong>Assured Gift:</strong> Dukan par aakar koi bhi phone ya laptop lene par turant gift pack diya jata hai!
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Footer */}
          <footer className="py-8 px-4 text-center text-xs text-slate-500 bg-[#05070B]">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>© 2026 Chintu Mobile & Laptop Store. All Rights Reserved.</div>
              <div className="text-slate-400">New Bundu Road, Silli, Ranchi, Jharkhand - 835102</div>
            </div>
          </footer>

          {/* Cart Drawer */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/75 backdrop-blur-sm">
              <div className="w-full max-w-md bg-[#0a0e17] h-full p-6 flex flex-col justify-between border-l border-slate-800">
                <div>
                  <div className="flex justify-between items-center pb-4 border-b border-slate-800">
                    <h3 className="font-bold text-white font-display">Your Order Bag ({cart.reduce((a,b)=>a+b.qty,0)})</h3>
                    <button onClick={() => setIsCartOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                  </div>

                  <div className="py-4 space-y-3 max-h-[60vh] overflow-y-auto">
                    {cart.length === 0 ? (
                      <div className="text-center py-8 text-slate-400">Your bag is empty.</div>
                    ) : (
                      cart.map(item => (
                        <div key={item.id} className="p-3 rounded-xl bg-slate-900 border border-slate-800 flex justify-between items-center">
                          <div>
                            <div className="text-xs font-bold text-white">{item.name}</div>
                            <div className="text-xs text-amber-400 font-mono-num font-bold">₹{item.price.toLocaleString('en-IN')} x {item.qty}</div>
                            {item.freeGift && <div className="text-[10px] text-emerald-400">🎁 {item.freeGift}</div>}
                          </div>
                          <button
                            onClick={() => setCart(prev => prev.filter(i => i.id !== item.id))}
                            className="text-xs text-rose-400"
                          >
                            Remove
                          </button>
                        </div>
                      ))
                    )}
                  </div>
                </div>

                {cart.length > 0 && (
                  <div className="pt-4 border-t border-slate-800 space-y-3">
                    <div className="flex justify-between text-sm font-bold text-white">
                      <span>Total Amount:</span>
                      <span className="font-mono-num text-amber-400">
                        ₹{cart.reduce((sum, item) => sum + (item.price * item.qty), 0).toLocaleString('en-IN')}
                      </span>
                    </div>

                    <a
                      href={`https://wa.me/${STORE_INFO.whatsapp}?text=${encodeURIComponent(
                        `*NEW ORDER - CHINTU MOBILE & LAPTOP SILI*\n\n` +
                        cart.map((it, idx) => `${idx + 1}. ${it.name} x ${it.qty} = ₹${it.price * it.qty}`).join('\n') +
                        `\n\nTotal: ₹${cart.reduce((sum, item) => sum + (item.price * item.qty), 0)}\nPlease confirm stock & free gifts at New Bundu Road store!`
                      )}`}
                      target="_blank"
                      rel="noreferrer"
                      className="w-full py-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-xs text-center block"
                    >
                      Send Order to WhatsApp
                    </a>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Floating WhatsApp Action */}
          <a
            href={`https://wa.me/${STORE_INFO.whatsapp}?text=${encodeURIComponent('Namaste Chintu Mobile & Laptop Silli! I have an enquiry about mobile/laptop/repair.')}`}
            target="_blank"
            rel="noreferrer"
            className="fixed bottom-6 right-6 z-40 px-4 py-3 rounded-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs shadow-2xl flex items-center gap-2"
          >
            <span>💬 WhatsApp Chat</span>
          </a>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
